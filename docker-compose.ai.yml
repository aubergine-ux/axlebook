# Optional local AI. Runs Ollama next to Axlebook on a private network:
#
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
#
# The first start downloads the model once (about 2 GB for qwen2.5:3b). After that
# nothing leaves your server. Ollama isn't published on any port.
# With an NVIDIA GPU, uncomment the `deploy` block for much faster answers.
services:
  axlebook:
    environment:
      AI_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.40.14
    container_name: axlebook-ollama
    restart: unless-stopped
    volumes:
      - axlebook-ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  axlebook-ollama:
