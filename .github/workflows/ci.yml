name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm run coverage
      - name: Brand outputs are current (tokens + contrast, icons)
        run: |
          npm run tokens
          npm run icons
          git diff --exit-code apps/web/src/theme/tokens.css apps/web/src/components/icons.gen.ts

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, SQLite)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # Running from source on Windows (Docker Desktop users run the Linux image).
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:pg

  test-ollama:
    name: Local assistant against Ollama (optional)
    runs-on: ubuntu-latest
    # Informational: a slow runner or a model download hiccup shouldn't block a merge.
    continue-on-error: true
    services:
      ollama:
        image: ollama/ollama:0.40.14
        ports: ["11434:11434"]
    env:
      OLLAMA_TEST_URL: http://localhost:11434
      OLLAMA_TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull a small model
        run: |
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags >/dev/null && break; sleep 2; done
          curl -sf -X POST localhost:11434/api/pull -d '{"model":"qwen2.5:0.5b","stream":false}'
      - run: npx vitest run --project server src/modules/assistant/real-ollama.test.ts

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/home-assistant
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # The release builds arm64 natively; build and start it here too, so a release is never the
  # first time an arm64 image is made.
  build-arm64:
    name: Docker image (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: axlebook:ci
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,mode=max,scope=linux-arm64
      - name: Smoke test container
        run: |
          docker run -d --name axlebook -p 8080:8080 axlebook:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/v1/health && exit 0
            sleep 1
          done
          docker logs axlebook
          exit 1

  build:
    name: Build & Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: axlebook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name axlebook -p 8080:8080 axlebook:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/v1/health && exit 0
            sleep 1
          done
          docker logs axlebook
          exit 1
