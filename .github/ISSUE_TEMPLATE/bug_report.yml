name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Axlebook version
      description: Shown at the bottom of Settings, or the image tag you run.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite (default), Postgres]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Firefox 145 on Linux, Safari on iPhone (installed as app)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs axlebook`. Remove anything private.
      render: shell
